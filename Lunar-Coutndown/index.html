<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Year Countdown</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
  <link rel='icon' href='./icon.jpg'>
</head>

<body>
  <svg width="0" height="0" style="position:absolute;">
    <filter id="liquid-glass">
      <feTurbulence type="fractalNoise" baseFrequency="0.01 0.04" numOctaves="1" result="turbulence" />
      <feDisplacementMap in="SourceGraphic" in2="turbulence" scale="30" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </svg>

  <audio src="bg.mp3" autoplay loop>
    <embed src="bg.mp3" hidden="true" />
  </audio>

  <div class="content-wrapper">
    <p class="header"></p>
    <h1 class="year" id="new-year"></h1>
    <div class="timer">
      <div class="timer-box">
        <div class="timer-box__count">
          <span id="days">0</span>
        </div>
        <div class="timer-box__text">Days</div>
      </div>
      <div class="timer-box">
        <div class="timer-box__count">
          <span id="hours">0</span>
        </div>
        <div class="timer-box__text">Hours</div>
      </div>
      <div class="timer-box">
        <div class="timer-box__count">
          <span id="minutes">0</span>
        </div>
        <div class="timer-box__text">Minutes</div>
      </div>
      <div class="timer-box">
        <div class="timer-box__count">
          <span id="seconds">0</span>
        </div>
        <div class="timer-box__text">Seconds</div>
      </div>
    </div>
  </div>
  <script src="./script.js"></script>
  <script src="./sakura.js"></script>

</body>

</html>
