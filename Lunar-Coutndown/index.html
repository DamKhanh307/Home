<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Year Countdown</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
  <link rel='icon' href='./icon.jpg'>
</head>

<body>
  <svg width="0" height="0" style="position:absolute;">
    <filter id="liquid-glass">
      <feTurbulence type="fractalNoise" baseFrequency="0.01 0.04" numOctaves="1" result="turbulence" />
      <feDisplacementMap in="SourceGraphic" in2="turbulence" scale="30" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </svg>

  <audio src="bg.mp3" autoplay loop>
    <embed src="bg.mp3" hidden="true" />
  </audio>

  <div class="content-wrapper">
    <p class="header"></p>
    <h1 class="year" id="new-year"></h1>
    <div class="timer">
      <div class="timer-box">
        <div class="timer-box__count">
          <span id="days">0</span>
        </div>
        <div class="timer-box__text">Days</div>
      </div>
      <div class="timer-box">
        <div class="timer-box__count">
          <span id="hours">0</span>
        </div>
        <div class="timer-box__text">Hours</div>
      </div>
      <div class="timer-box">
        <div class="timer-box__count">
          <span id="minutes">0</span>
        </div>
        <div class="timer-box__text">Minutes</div>
      </div>
      <div class="timer-box">
        <div class="timer-box__count">
          <span id="seconds">0</span>
        </div>
        <div class="timer-box__text">Seconds</div>
      </div>
    </div>
  </div>

  <div class="fireworks-container">
  </div>
<canvas id="canvas"></canvas>
    <div class="block-audio">
      <audio class="exp" src="http://softbase.jp/fireworks/audio/firework/exp1.mp3" controls="controls"></audio>
      <audio class="exp" src="http://softbase.jp/fireworks/audio/firework/exp1.mp3" controls="controls"></audio>
      <audio class="exp" src="http://softbase.jp/fireworks/audio/firework/exp1.mp3" controls="controls"></audio>
      <audio class="exp" src="http://softbase.jp/fireworks/audio/firework/exp2.mp3" controls="controls"></audio>
      <audio class="exp" src="http://softbase.jp/fireworks/audio/firework/exp2.mp3" controls="controls"></audio>
      <audio class="exp" src="http://softbase.jp/fireworks/audio/firework/exp2.mp3" controls="controls"></audio>
      <audio class="exp" src="http://softbase.jp/fireworks/audio/firework/exp3.mp3" controls="controls"></audio>
      <audio class="exp" src="http://softbase.jp/fireworks/audio/firework/exp3.mp3" controls="controls"></audio>
      <audio class="exp" src="http://softbase.jp/fireworks/audio/firework/exp3.mp3" controls="controls"></audio>
      <audio class="exp" src="http://softbase.jp/fireworks/audio/firework/exp4.mp3" controls="controls"></audio>
      <audio class="exp" src="http://softbase.jp/fireworks/audio/firework/exp4.mp3" controls="controls"></audio>
      <audio class="exp" src="http://softbase.jp/fireworks/audio/firework/exp4.mp3" controls="controls"></audio>
      <audio class="exp" src="http://softbase.jp/fireworks/audio/firework/exp5.mp3" controls="controls"></audio>
      <audio class="exp" src="http://softbase.jp/fireworks/audio/firework/exp5.mp3" controls="controls"></audio>
      <audio class="exp" src="http://softbase.jp/fireworks/audio/firework/exp5.mp3" controls="controls"></audio>
      <audio class="exp" src="http://softbase.jp/fireworks/audio/firework/exp6.mp3" controls="controls"></audio>
      <audio class="exp" src="http://softbase.jp/fireworks/audio/firework/exp6.mp3" controls="controls"></audio>
      <audio class="exp" src="http://softbase.jp/fireworks/audio/firework/exp6.mp3" controls="controls"></audio>
      <audio class="exp" src="http://softbase.jp/fireworks/audio/firework/exp7.mp3" controls="controls"></audio>
      <audio class="exp" src="http://softbase.jp/fireworks/audio/firework/exp7.mp3" controls="controls"></audio>
      <audio class="exp" src="http://softbase.jp/fireworks/audio/firework/exp7.mp3" controls="controls"></audio>
      <audio class="exp" src="http://softbase.jp/fireworks/audio/firework/exp8.mp3" controls="controls"></audio>
      <audio class="exp" src="http://softbase.jp/fireworks/audio/firework/exp8.mp3" controls="controls"></audio>
      <audio class="exp" src="http://softbase.jp/fireworks/audio/firework/exp8.mp3" controls="controls"></audio>
      <audio class="launch" src="http://softbase.jp/fireworks/audio/firework/launch1.mp3" controls="controls"></audio>
      <audio class="launch" src="http://softbase.jp/fireworks/audio/firework/launch1.mp3" controls="controls"></audio>
      <audio class="launch" src="http://softbase.jp/fireworks/audio/firework/launch2.mp3" controls="controls"></audio>
      <audio class="launch" src="http://softbase.jp/fireworks/audio/firework/launch2.mp3" controls="controls"></audio>
      <audio class="launch" src="http://softbase.jp/fireworks/audio/firework/launch3.mp3" controls="controls"></audio>
      <audio class="launch" src="http://softbase.jp/fireworks/audio/firework/launch3.mp3" controls="controls"></audio>
      <audio class="launch" src="http://softbase.jp/fireworks/audio/firework/launch4.mp3" controls="controls"></audio>
      <audio class="launch" src="http://softbase.jp/fireworks/audio/firework/launch4.mp3" controls="controls"></audio>
      <audio class="launch" src="http://softbase.jp/fireworks/audio/firework/launch5.mp3" controls="controls"></audio>
      <audio class="launch" src="http://softbase.jp/fireworks/audio/firework/launch5.mp3" controls="controls"></audio>
    </div>
  <script src="./script.js"></script>
  <script src="./sakura.js"></script>
  <script src="./fireworks.js"></script>
  <script src="./jQuery.js"></script>

  <script>
    const turbulence = document.querySelector('#liquid-glass feTurbulence');
    let frame = 0;
    function animate() {
      // Animate the baseFrequency to create a flowing liquid effect
      const newBaseFrequency = `0.01 ${0.02 + 0.01 * Math.sin(frame)}`;
      turbulence.setAttribute('baseFrequency', newBaseFrequency);
      frame += 0.02;
      requestAnimationFrame(animate);
    }
    animate();
  </script>

</body>

</html>
