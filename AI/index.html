<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Z-Image Turbo – Demo</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Inter", sans-serif;
    }

    body {
      background: #0e0f10;
      color: #fff;
      overflow: hidden;
    }

    .title {
      text-align: center;
      font-size: 2.5rem;
      font-weight: 800;
      padding: 25px 0 15px;
      animation: fadeIn 1.2s ease;
    }

    .container {
      width: 100vw;
      height: calc(100vh - 100px);
      padding: 20px;
      animation: fadeIn 1.4s ease;
      position: relative;
    }

    .frame-wrapper {
      width: 100%;
      height: 100%;
      border-radius: 18px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.08);
      transition: 0.3s ease-in-out;
    }

    .frame-wrapper:hover {
      box-shadow: 0 0 35px rgba(255, 255, 255, 0.15);
      transform: scale(1.01);
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }


    #loading {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      backdrop-filter: blur(16px);
      background: rgba(0, 0, 0, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 18px;
      z-index: 20;
      transition: opacity 0.6s ease;
    }

    .ring {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, 0.25);
      border-top-color: #ffffff;
      animation: spin 1.1s linear infinite, glow 1.8s ease-in-out infinite alternate;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes glow {
      from { box-shadow: 0 0 8px rgba(255,255,255,0.3); }
      to   { box-shadow: 0 0 25px rgba(255,255,255,0.9); }
    }

    .loading-text {
      font-size: 1.1rem;
      letter-spacing: 1px;
      opacity: 0.8;
      animation: fadeIn 1.5s ease-in-out infinite alternate;
    }


    /* MOBILE */
    @media (max-width: 768px) {
      .title {
        font-size: 1.8rem;
        padding: 15px 0 10px;
      }
      .container {
        padding: 10px;
        height: calc(100vh - 80px);
      }
      .frame-wrapper {
        border-radius: 12px;
      }
    }

    @media (max-width: 480px) {
      .title {
        font-size: 1.5rem;
        padding: 12px 0 8px;
      }
      .container {
        padding: 8px;
        height: calc(100vh - 70px);
      }
      .frame-wrapper {
        border-radius: 10px;
      }
    }

  </style>
</head>

<body>
  <h1 class="title">⚡ Z-Image Turbo Demo</h1>

  <div class="container">
    <div class="frame-wrapper">
        
      <div id="loading">
        <div class="ring"></div>
        <div class="loading-text">Loading AI Workspace...</div>
      </div>

      <iframe
        id ="AI"
        title="Z-Image Turbo Demo"
        src="https://mrfakename-z-image-turbo.hf.space">
      </iframe>
    </div>
  </div>

<script>
const frame = document.getElementById("AI");
const loading = document.getElementById("loading")
const title = document.querySelector(".title");

let lastHeight = 0;

const check = setInterval(() => {
    const h = frame.clientHeight;

    if (h !== lastHeight && h > 50) {
        console.log("UI is visible!");
        
        setTimeout(() => {
            loading.style.opacity = "0";
            setTimeout(() => loading.style.display = "none", 600);
            title.style.display = "none";
        }, 2000);

        clearInterval(check);
    }

    lastHeight = h;
}, 200);
</script>

</body>
</html>
