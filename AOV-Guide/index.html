<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Tra cứu Skin ID và xem Splash Art 2D cho Arena of Valor (AOV)">
    <title>AOV Skin Viewer</title>
    <link rel="shortcut icon" href="../IMG/logo.png" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #00f0ff;
            --secondary: #7b2ffc;
            --accent: #ff2d75;
            --bg-dark: #0a0a1a;
            --bg-surface: #0f0f25;
            --bg-card: rgba(15, 15, 35, 0.7);
            --bg-card-hover: rgba(20, 20, 45, 0.85);
            --text: #e8e8f0;
            --text-dim: #7777a0;
            --border: rgba(0, 240, 255, 0.1);
            --border-hover: rgba(0, 240, 255, 0.25);
        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(10, 10, 26, 0.5);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(0, 240, 255, 0.2);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 240, 255, 0.4);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-dark);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Background */
        .bg-grid {
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(0, 240, 255, 0.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.025) 1px, transparent 1px);
            background-size: 60px 60px;
            z-index: 0;
            pointer-events: none;
        }

        .bg-glow {
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 60% 40% at 50% 0%, rgba(123, 47, 252, 0.12) 0%, transparent 60%);
            z-index: 0;
            pointer-events: none;
        }

        .scan-line {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--primary), transparent);
            opacity: 0.1;
            animation: scanDown 8s linear infinite;
            z-index: 0;
            pointer-events: none;
        }

        @keyframes scanDown {
            0% { top: -2px; }
            100% { top: 100%; }
        }

        /* Layout */
        .app {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 2rem;
            min-height: 100vh;
        }

        /* Header */
        .header {
            text-align: center;
            padding: 1rem 0;
            animation: fadeDown 0.6s ease-out;
        }

        @keyframes fadeDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-dim);
            text-decoration: none;
            font-size: 0.8rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: color 0.3s ease, gap 0.3s ease;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            border: 1px solid transparent;
        }

        .back-link:hover {
            color: var(--primary);
            gap: 0.75rem;
            border-color: var(--border);
        }

        .back-link svg {
            width: 14px;
            height: 14px;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.3rem 0.8rem;
            border-radius: 100px;
            background: rgba(0, 240, 255, 0.06);
            border: 1px solid rgba(0, 240, 255, 0.15);
            font-size: 0.65rem;
            font-weight: 500;
            color: var(--primary);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            font-family: 'JetBrains Mono', monospace;
        }

        .status-badge .dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: #00ff88;
            animation: pulse-dot 2s ease-in-out infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .title-section {
            margin-bottom: 0.5rem;
        }

        .title {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(1.8rem, 4vw, 2.8rem);
            font-weight: 800;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #fff 0%, var(--primary) 60%, var(--secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Search Area */
        .search-section {
            animation: fadeUp 0.6s ease-out 0.1s forwards;
            opacity: 0;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .search-wrapper {
            position: relative;
            max-width: 600px;
            margin: 0 auto;
        }

        .search-icon {
            position: absolute;
            left: 1.25rem;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            color: var(--text-dim);
            pointer-events: none;
            transition: color 0.3s ease;
        }

        .search-input {
            width: 100%;
            padding: 1rem 1.25rem 1rem 3.25rem;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .search-input::placeholder {
            color: var(--text-dim);
            font-weight: 300;
        }

        .search-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(0, 240, 255, 0.08), 0 0 20px rgba(0, 240, 255, 0.05);
        }

        .search-input:focus + .search-icon,
        .search-wrapper:has(.search-input:focus) .search-icon {
            color: var(--primary);
        }

        .search-hint {
            text-align: center;
            margin-top: 0.75rem;
            font-size: 0.72rem;
            color: var(--text-dim);
            letter-spacing: 0.5px;
        }

        .search-hint kbd {
            padding: 0.15rem 0.5rem;
            border-radius: 4px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.04);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.65rem;
        }

        /* Results Counter */
        .results-info {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 0.25rem;
            font-size: 0.75rem;
            color: var(--text-dim);
            font-family: 'JetBrains Mono', monospace;
            letter-spacing: 0.5px;
            min-height: 1.5rem;
        }

        .results-count {
            color: var(--primary);
        }

        /* Results Grid */
        .results-container {
            animation: fadeUp 0.6s ease-out 0.2s forwards;
            opacity: 0;
        }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1rem;
        }

        /* Skin Card */
        .skin-card {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border);
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: border-color 0.3s ease, box-shadow 0.3s ease, transform 0.3s ease;
            cursor: pointer;
        }

        .skin-card:hover {
            border-color: var(--border-hover);
            box-shadow: 0 8px 40px rgba(0, 240, 255, 0.08);
            transform: translateY(-2px);
        }

        .skin-card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.875rem 1rem;
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }

        .skin-id-badge {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            font-weight: 500;
            color: var(--primary);
            background: rgba(0, 240, 255, 0.08);
            padding: 0.2rem 0.6rem;
            border-radius: 6px;
            border: 1px solid rgba(0, 240, 255, 0.12);
            letter-spacing: 0.5px;
        }

        .skin-hex {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.65rem;
            color: var(--text-dim);
            opacity: 0.7;
        }

        .skin-name {
            padding: 0.75rem 1rem;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .skin-name .view-art {
            font-size: 0.65rem;
            color: var(--secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0;
            transition: opacity 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .skin-card:hover .view-art {
            opacity: 1;
        }

        /* Splash Art Preview */
        .splash-preview {
            position: relative;
            width: 100%;
            height: 0;
            overflow: hidden;
            transition: height 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            background: rgba(0, 0, 0, 0.3);
        }

        .splash-preview.open {
            height: 200px;
        }

        .splash-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center top;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .splash-preview img.loaded {
            opacity: 1;
        }

        .splash-loading {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-dim);
            font-size: 0.75rem;
            letter-spacing: 1px;
        }

        .splash-loading .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(0, 240, 255, 0.1);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 0.5rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .splash-error {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-dim);
            font-size: 0.75rem;
            opacity: 0.7;
        }

        /* Fullscreen Viewer */
        .viewer-overlay {
            position: fixed;
            inset: 0;
            background: rgba(5, 5, 15, 0.95);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 1.5rem;
            animation: fadeIn 0.3s ease;
        }

        .viewer-overlay.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .viewer-close {
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text);
            width: 40px;
            height: 40px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            transition: background 0.3s ease, border-color 0.3s ease;
        }

        .viewer-close:hover {
            background: rgba(255, 45, 117, 0.1);
            border-color: rgba(255, 45, 117, 0.3);
        }

        .viewer-image {
            max-width: 90vw;
            max-height: 75vh;
            border-radius: 12px;
            box-shadow: 0 20px 80px rgba(0, 0, 0, 0.5);
            object-fit: contain;
        }

        .viewer-info {
            text-align: center;
        }

        .viewer-info h3 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
            color: var(--primary);
            letter-spacing: 1px;
            margin-bottom: 0.3rem;
        }

        .viewer-info p {
            font-size: 0.8rem;
            color: var(--text-dim);
            font-family: 'JetBrains Mono', monospace;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-dim);
        }

        .empty-state .empty-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        .empty-state h3 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
            color: var(--text);
            margin-bottom: 0.5rem;
            letter-spacing: 1px;
        }

        .empty-state p {
            font-size: 0.85rem;
            max-width: 400px;
            margin: 0 auto;
            line-height: 1.6;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .app {
                padding: 1.25rem 1rem;
                gap: 1.5rem;
            }

            .results-grid {
                grid-template-columns: 1fr;
            }

            .header-nav {
                flex-direction: column;
                gap: 0.75rem;
            }

            .viewer-image {
                max-width: 95vw;
                max-height: 60vh;
            }
        }
    </style>
</head>
<body>
    <div class="bg-grid"></div>
    <div class="bg-glow"></div>
    <div class="scan-line"></div>

    <div class="app">
        <!-- Header -->
        <header class="header">
            <nav class="header-nav">
                <a href="./direct.html" class="back-link" id="btn-back">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                    <span>Quay lại</span>
                </a>
                <div class="status-badge">
                    <span class="dot"></span>
                    <span id="data-status">Đang tải...</span>
                </div>
            </nav>
            <div class="title-section">
                <h1 class="title">SKIN VIEWER</h1>
            </div>
        </header>

        <!-- Search -->
        <section class="search-section">
            <div class="search-wrapper">
                <input
                    type="text"
                    id="search"
                    class="search-input"
                    placeholder="Tìm theo ID hoặc tên skin..."
                    autocomplete="off"
                >
                <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
            </div>
            <p class="search-hint">Nhập <kbd>ID tướng</kbd> để xem tất cả skin (vd: 130 = Airi) hoặc <kbd>tên skin</kbd></p>
        </section>

        <!-- Results -->
        <section class="results-container">
            <div class="results-info">
                <span id="results-counter"></span>
                <span id="results-mode"></span>
            </div>
            <div id="results" class="results-grid"></div>
        </section>
    </div>

    <!-- Fullscreen Viewer -->
    <div class="viewer-overlay" id="viewer">
        <button class="viewer-close" id="viewer-close" title="Đóng">✕</button>
        <img class="viewer-image" id="viewer-image" src="" alt="Splash Art">
        <div class="viewer-info">
            <h3 id="viewer-name"></h3>
            <p id="viewer-id"></p>
        </div>
    </div>

    <script>
        // ============ DATA ============
        let allEntries = [];
        let heroMap = new Map(); // heroId -> [skinEntries]

        async function loadData() {
            try {
                const response = await fetch('./database.txt');
                const data = await response.text();
                const lines = data.split('\n');

                lines.forEach(line => {
                    const parts = line.split(',').map(p => p.trim());
                    const idPart = parts.find(p => p.startsWith('Decimal_ID:'));
                    const hexPart = parts.find(p => p.startsWith('Hex_ID:'));
                    const namePart = parts.find(p => p.startsWith('Skin_Name:'));

                    if (idPart && namePart) {
                        const id = idPart.split(':')[1].trim();
                        const hex = hexPart ? hexPart.split(':')[1].trim() : '';
                        const name = namePart.split(':')[1].trim();
                        const heroId = id.slice(0, -2); // e.g. 13000 -> 130

                        const entry = { id, hex, name, heroId };
                        allEntries.push(entry);

                        if (!heroMap.has(heroId)) {
                            heroMap.set(heroId, []);
                        }
                        heroMap.get(heroId).push(entry);
                    }
                });

                document.getElementById('data-status').textContent = `${allEntries.length} skins loaded`;
            } catch (error) {
                console.error('Error loading data:', error);
                document.getElementById('data-status').textContent = 'Lỗi tải dữ liệu';
            }
        }

        // ============ SEARCH ============
        function debounce(func, wait) {
            let timeout;
            return function(...args) {
                clearTimeout(timeout);
                timeout = setTimeout(() => func.apply(this, args), wait);
            };
        }

        function search() {
            const term = document.getElementById('search').value.trim().toLowerCase();
            const resultsDiv = document.getElementById('results');
            const counter = document.getElementById('results-counter');
            const mode = document.getElementById('results-mode');

            resultsDiv.innerHTML = '';
            counter.textContent = '';
            mode.textContent = '';

            if (!term) {
                resultsDiv.innerHTML = `
                    <div class="empty-state" style="grid-column: 1 / -1;">
                        <div class="empty-icon">🔍</div>
                        <h3>Bắt đầu tìm kiếm</h3>
                        <p>Nhập Hero ID (vd: 130) để xem tất cả skin, hoặc nhập tên skin để tìm kiếm.</p>
                    </div>
                `;
                return;
            }

            let results = [];

            // First check if it's a hero ID
            if (/^\d+$/.test(term) && heroMap.has(term)) {
                results = heroMap.get(term);
                mode.textContent = `Hero ID: ${term}`;
            } else {
                // Search by ID prefix or name
                results = allEntries.filter(e =>
                    e.id.toLowerCase().startsWith(term) ||
                    e.name.toLowerCase().includes(term)
                );
            }

            // Filter out [ex] skins unless explicitly searched
            if (!/\[ex\]/.test(term)) {
                const filteredResults = results.filter(e => !e.name.includes('[ex]'));
                // Only use filtered if there are results, otherwise show all
                if (filteredResults.length > 0) {
                    results = filteredResults;
                }
            }

            if (results.length === 0) {
                resultsDiv.innerHTML = `
                    <div class="empty-state" style="grid-column: 1 / -1;">
                        <div class="empty-icon">🚫</div>
                        <h3>Không tìm thấy</h3>
                        <p>Không có kết quả nào cho "${term}". Hãy thử ID hoặc tên khác.</p>
                    </div>
                `;
                counter.textContent = '0 kết quả';
                return;
            }

            counter.innerHTML = `<span class="results-count">${results.length}</span> kết quả`;

            // Limit display for performance
            const displayResults = results.slice(0, 100);

            displayResults.forEach((entry, index) => {
                const card = createSkinCard(entry, index);
                resultsDiv.appendChild(card);
            });

            if (results.length > 100) {
                const notice = document.createElement('div');
                notice.className = 'empty-state';
                notice.style.gridColumn = '1 / -1';
                notice.innerHTML = `<p>Hiển thị 100/${results.length} kết quả. Hãy tìm kiếm cụ thể hơn.</p>`;
                resultsDiv.appendChild(notice);
            }
        }

        // ============ CARD ============
        function createSkinCard(entry, index) {
            const card = document.createElement('div');
            card.className = 'skin-card';
            card.style.animationDelay = `${Math.min(index * 30, 500)}ms`;
            card.style.animation = `fadeUp 0.4s ease-out ${Math.min(index * 30, 500)}ms forwards`;
            card.style.opacity = '0';

            const splashUrl = `https://dl.ops.kgtw.garenanow.com/CHT/HeroTrainingLoadingNew_B36/${entry.id}.jpg`;

            card.innerHTML = `
                <div class="skin-card-header">
                    <span class="skin-id-badge">ID: ${entry.id}</span>
                    <span class="skin-hex">${entry.hex.toUpperCase()}</span>
                </div>
                <div class="skin-name">
                    <span>${entry.name}</span>
                    <span class="view-art">
                        Xem ảnh
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                            <circle cx="8.5" cy="8.5" r="1.5"></circle>
                            <polyline points="21 15 16 10 5 21"></polyline>
                        </svg>
                    </span>
                </div>
                <div class="splash-preview" data-url="${splashUrl}" data-loaded="false">
                    <div class="splash-loading">
                        <div class="spinner"></div>
                        Loading...
                    </div>
                </div>
            `;

            // Toggle splash preview
            card.addEventListener('click', (e) => {
                const preview = card.querySelector('.splash-preview');
                const isOpen = preview.classList.contains('open');

                if (isOpen) {
                    preview.classList.remove('open');
                } else {
                    preview.classList.add('open');

                    // Lazy load image
                    if (preview.dataset.loaded === 'false') {
                        const img = document.createElement('img');
                        img.src = splashUrl;
                        img.alt = entry.name;

                        img.onload = () => {
                            preview.dataset.loaded = 'true';
                            const loader = preview.querySelector('.splash-loading');
                            if (loader) loader.remove();
                            img.classList.add('loaded');

                            // Click image for fullscreen
                            img.addEventListener('click', (ev) => {
                                ev.stopPropagation();
                                openViewer(splashUrl, entry.name, entry.id);
                            });
                        };

                        img.onerror = () => {
                            const loader = preview.querySelector('.splash-loading');
                            if (loader) {
                                loader.innerHTML = '❌ Không tải được ảnh';
                                loader.style.color = 'var(--accent)';
                            }
                        };

                        preview.appendChild(img);
                    }
                }
            });

            return card;
        }

        // ============ VIEWER ============
        function openViewer(url, name, id) {
            const viewer = document.getElementById('viewer');
            const img = document.getElementById('viewer-image');
            const nameEl = document.getElementById('viewer-name');
            const idEl = document.getElementById('viewer-id');

            img.src = url;
            nameEl.textContent = name;
            idEl.textContent = `Skin ID: ${id}`;
            viewer.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeViewer() {
            const viewer = document.getElementById('viewer');
            viewer.classList.remove('active');
            document.body.style.overflow = '';
        }

        // ============ INIT ============
        document.addEventListener('DOMContentLoaded', () => {
            loadData();

            const searchInput = document.getElementById('search');
            const debouncedSearch = debounce(search, 300);
            searchInput.addEventListener('input', debouncedSearch);

            // Show empty state initially
            search();

            // Viewer events
            document.getElementById('viewer-close').addEventListener('click', closeViewer);
            document.getElementById('viewer').addEventListener('click', (e) => {
                if (e.target === e.currentTarget) closeViewer();
            });

            // ESC to close viewer
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') closeViewer();
            });

            // Focus search on "/" key
            document.addEventListener('keydown', (e) => {
                if (e.key === '/' && document.activeElement !== searchInput) {
                    e.preventDefault();
                    searchInput.focus();
                }
            });
        });
    </script>
</body>
</html>
